name: Collect X researcher timelines

on:
  workflow_dispatch:
  schedule:
    - cron: "35 7 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: collect-x-researcher-timelines
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect timelines
        env:
          XFLUX_API_KEY: ${{ secrets.XFLUX_API_KEY }}
          LOOKBACK_HOURS: "26"
          TIMELINE_LIMIT: "20"
        run: python collector.py

      - name: Commit latest data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update X researcher timelines"
            git push
          fi
